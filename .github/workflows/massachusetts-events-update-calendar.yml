name: Update Massachusetts events calendars

on:
  workflow_dispatch:
  schedule:
    - cron: "47 11 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil icalendar playwright
          python -m playwright install --with-deps chromium

      - name: Generate Massachusetts calendar
        run: python generate_calendar.py

      - name: Add Worcester college calendars
        run: python add_worcester_colleges.py

      - name: Add Central Massachusetts calendars
        run: python add_central_massachusetts.py

      - name: Generate Northborough calendar
        run: python generate_northborough.py

      - name: Commit updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add massachusetts-events.ics northborough-events.ics
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update Massachusetts and Northborough events calendars"
            git push
          fi
