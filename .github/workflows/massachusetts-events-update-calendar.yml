name: Update Massachusetts events calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "47 11 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil icalendar playwright
          python -m playwright install --with-deps chromium

      - name: Generate Massachusetts calendar
        run: python generate_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add massachusetts-events.ics
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update Massachusetts events calendar"
            git push
          fi
